# 명언 앱 DB 접속 정보 (비밀번호는 여기 쓰지 않는다)
#  - 비밀번호: 환경변수 DB_PASSWORD 또는 프로젝트 루트의 db.local.properties (git 에 올리지 않음)
#  - 아래 값도 환경변수(DB_HOST, DB_PORT, DB_USERNAME, DB_NAME)나 db.local.properties 로 덮어쓸 수 있다.
